name: Build & Test

on:
  push:
    branches:
      - "commit-*"

permissions:
  contents: write
  pull-requests: write

jobs:
  build_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build & Test
        run: mvn clean verify -DskipTests=false

      - name: Create Pull Request
          uses: peter-evans/create-pull-request@v6
          with:
            base: develop
            branch: pr/${{ github.ref_name }}
            commit-message: "chore: trigger PR"